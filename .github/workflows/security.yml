name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: web03384a/security-control/.github/workflows/security.yml@1149b903190e69e81eac2175387170565b631a11
    with:
      control_ref: 1149b903190e69e81eac2175387170565b631a11

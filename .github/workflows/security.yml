name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: web03384a/security-control/.github/workflows/security.yml@c874d52535538bd1e12d5a28e1daf09af993ad0a
    with:
      control_ref: c874d52535538bd1e12d5a28e1daf09af993ad0a

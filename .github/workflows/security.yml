name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: web03384a/security-control/.github/workflows/security.yml@f117da9e59e79c3ace9713837ded3ec01b34e968
    with:
      control_ref: f117da9e59e79c3ace9713837ded3ec01b34e968
